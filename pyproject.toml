[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_projects"
version = "0.1.0"
description = "A collection of reinforcement learning mini-projects, environments, agents, and notebooks."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kushagra Agrawal" }
]
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "notebook>=7.0",
    "ipykernel>=6.0",
]

dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.8",
]

all = [
    "rl_projects[notebooks,dev]",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
